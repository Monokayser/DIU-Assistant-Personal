<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="DIU Assistant – AI-powered chatbot for Daffodil International University admissions, scholarships, programs, and campus information." />
    <meta name="theme-color" content="#0a0c0a" />
    <meta name="darkreader-lock" />
    <meta name="color-scheme" content="dark light" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=2" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png?v=2" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png?v=2" />
    <link rel="icon" type="image/png" sizes="512x512" href="/favicon.png?v=2" />
    <link rel="shortcut icon" type="image/png" sizes="32x32" href="/favicon-32.png?v=2" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png?v=2" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&family=Outfit:wght@100..900&family=Fira+Code:wght@300..700&display=swap" rel="stylesheet">
    <title>DIU Assistant</title>
    <script>
      (() => {
        const storageKey = "diu_theme";
        const fallbackTheme = "dark";

        try {
          const storedTheme = window.localStorage.getItem(storageKey);
          const theme = storedTheme === "light" ? "light" : fallbackTheme;
          const themeColor = theme === "dark" ? "#0a0c0a" : "#f8f9f7";

          document.documentElement.setAttribute("data-theme", theme);
          document.querySelector('meta[name="theme-color"]')?.setAttribute("content", themeColor);
        } catch {
          document.documentElement.setAttribute("data-theme", fallbackTheme);
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
