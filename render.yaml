services:
  - type: web
    name: diu-assistant-backend
    runtime: python
    plan: free
    rootDir: .
    buildCommand: pip install -r requirements.txt
    startCommand: python3 backend/main.py
    healthCheckPath: /api/health
    envVars:
      - key: API_HOST
        value: 0.0.0.0
      - key: API_PORT
        value: 10000
      - key: ALLOWED_ORIGINS
        value: "*"
      - key: GEMINI_MODEL
        value: gemini-3-flash-preview
      - key: GEMINI_TRANSCRIBE_MODEL
        value: gemini-3-flash-preview
      - key: GEMINI_ENABLE_SEARCH
        value: "true"
      - key: GEMINI_MAX_OUTPUT_TOKENS
        value: "1048576"
      - key: GEMINI_TRANSCRIBE_MAX_OUTPUT_TOKENS
        value: "160"
      - key: GEMINI_CONTEXT_CHARS
        value: "0"
      - key: GEMINI_TIMEOUT_SECONDS
        value: "60"
      - key: GEMINI_TRANSCRIBE_TIMEOUT_SECONDS
        value: "15"
      - key: MAX_JSON_BODY_BYTES
        value: "146800640"
      - key: DIU_SITE_MAX_PAGES
        value: "1000"
      - key: APP_TITLE
        value: DIU Assistant
      - key: APP_TAGLINE
        value: Gemini-powered DIU assistant for admissions, programs, scholarships, fees, and university documents.
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_API_KEYS
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SESSION_ID
        value: default
      - key: SUPABASE_DOCUMENT_TABLE
        value: document_chunks
      - key: SUPABASE_MATCH_RPC
        value: match_document_chunks
